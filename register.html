<html>
    <head>
        <style>

            body{
                background-color: black;
                text-align: center;
            }

            form{
                margin: auto;
                padding: 20px;
                width: 400px;
                background-color:#fff;
            }

            input, select, button{
                width: 90%;
                padding: 10px;
                margin: 10px;
            }

            button{
                background-color: #4CAF50;
                color: white;
                font-weight: bold;
                font-size: medium;
                cursor: pointer;
            }

            button:hover{
                background-color: #104212;
            }
        </style>
    </head>
    <body>
        <h1 style="color: blue">Kickstart with an exciting course</h1>
        <form action="http://localhost:8080/course/register" method="post">
            <label for="name">Enter your name: </label>
            <input name="name" type="text"> <br><br>

            <label for="emailId">Enter your emailId: </label>
            <input name="emailId" type="email"> <br><br>

             <label for="courseName">Choose a course</label>
             <select id="course" name="courseName">
                <option value="SpringBoot">SpringBoot</option>
                <option value="Java Essentials">Java Essentials</option>
                <option value="Python">Python</option>
             </select>

             <button type="submit">Submit</button>            
        </form>
    </body>
